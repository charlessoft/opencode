services:
  opencode-web:
    image: ghcr.io/anomalyco/opencode:1.14.48
    container_name: opencode-web
    working_dir: /workspace/hft_document
    command: ["web", "--hostname", "0.0.0.0", "--port", "4090"]
    ports:
      - "4090:4090"
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-change-me}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
      XDG_STATE_HOME: /state
      XDG_CACHE_HOME: /cache
    volumes:
      - D:/workspace/foxit/ai_skills/hft_document:/workspace/hft_document
      - opencode_data:/data
      - opencode_config:/config
      - opencode_state:/state
      - opencode_cache:/cache
    restart: unless-stopped

  opencode-web-local:
    build:
      context: .
      dockerfile: Dockerfile.web-local
    container_name: opencode-web-local
    working_dir: /workspace/hft_document
    command: ["web", "--hostname", "0.0.0.0", "--port", "4090"]
    ports:
      - "4091:4090"
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-change-me}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
      XDG_STATE_HOME: /state
      XDG_CACHE_HOME: /cache
    volumes:
      - D:/workspace/foxit/ai_skills/hft_document:/workspace/hft_document
      - opencode_local_data:/data
      - opencode_local_config:/config
      - opencode_local_state:/state
      - opencode_local_cache:/cache
    restart: unless-stopped

volumes:
  opencode_data:
  opencode_config:
  opencode_state:
  opencode_cache:
  opencode_local_data:
  opencode_local_config:
  opencode_local_state:
  opencode_local_cache:
